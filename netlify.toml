[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# Light caching header — keeps the site reasonably fresh while still being fast.
# Good for the Refresh Prices button and frequent data updates.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=60, stale-while-revalidate=300"

# NOTE: Removed the catch-all "/* → /index.html" SPA redirect.
# This is a multi-page site (index.html + mining.html + stocks.html + crypto.html),
# not a single-page app. The old redirect could cause unexpected behavior
# and was not needed. Direct file access now works cleanly.
