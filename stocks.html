<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Stocks • Andes Capital 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <!-- Full Header like Mining page -->
    <nav class="border-b border-zinc-800 bg-zinc-950/95 backdrop-blur-lg sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="flex items-center gap-x-3">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="6" fill="#1e3a5f"/>
                        <polygon points="0,32 6,18 12,26 18,12 24,24 30,10 36,20 40,28 40,40 0,40" fill="#475569"/>
                        <polygon points="0,36 5,24 11,30 17,17 23,28 29,15 35,25 40,32 40,40 0,40" fill="#64748b"/>
                        <polygon points="6,18 9,22 12,18 12,26 9,23 6,26" fill="#f1f5f9"/>
                        <polygon points="18,12 21,17 24,12 24,24 21,20 18,24" fill="#f1f5f9"/>
                        <polygon points="30,10 33,15 36,10 36,20" fill="#e0f2fe"/>
                        <rect x="0" y="33" width="40" height="7" fill="#3f2a1d"/>
                        <g stroke="#166534" stroke-width="1.3">
                            <line x1="1" y1="34.5" x2="39" y2="34.5"/>
                            <line x1="1" y1="36.5" x2="39" y2="36.5"/>
                            <line x1="1" y1="38.5" x2="39" y2="38.5"/>
                        </g>
                        <g stroke="#4ade80" stroke-width="0.7">
                            <circle cx="5" cy="35" r="1.4"/>
                            <circle cx="12" cy="37" r="1.4"/>
                            <circle cx="19" cy="35" r="1.4"/>
                            <circle cx="26" cy="37" r="1.4"/>
                            <circle cx="33" cy="35" r="1.4"/>
                        </g>
                        <circle cx="6.5" cy="35.2" r="0.7" fill="#f59e0b"/>
                        <circle cx="20.5" cy="35.2" r="0.7" fill="#f59e0b"/>
                    </svg>
                    <div>
                        <span class="font-display text-3xl font-semibold tracking-tighter">Andes Capital</span>
                        <span class="font-display text-3xl font-semibold tracking-tighter text-amber-400">360</span>
                    </div>
                    <div class="px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[10px] font-medium tracking-widest text-amber-400">HIGH RISK, HIGH REWARD</div>
                </div>
            </div>

            <div class="flex items-center gap-x-3 text-sm">
                <button onclick="refreshPrices()" class="px-4 py-2 border border-zinc-700 rounded-2xl hover:bg-zinc-900 flex items-center gap-x-2">
                    <i class="fa-solid fa-sync fa-sm"></i> 
                    <span id="refresh-btn-text">Refresh Prices</span>
                </button>

                <button onclick="alert('Add Company is a Premium feature.')" class="px-5 py-2 bg-gradient-to-r from-amber-400 to-yellow-500 text-zinc-950 font-semibold rounded-2xl">
                    <i class="fa-solid fa-plus"></i> <span>Add Company</span>
                </button>
                <span class="text-[10px] text-amber-400 -ml-2">Premium</span>

                <button onclick="alert('Subscribe is a Premium feature.')" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-2xl">
                    <i class="fa-solid fa-credit-card"></i> <span>Subscribe $14.99/mo</span>
                </button>

                <a href="index.html" 
                   class="px-4 py-2 border border-zinc-700 rounded-2xl hover:bg-zinc-900 flex items-center gap-x-2 text-sm">
                    ← Back to Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Section Header -->
    <div class="border-b border-zinc-800 bg-zinc-900/40">
        <div class="max-w-screen-2xl mx-auto px-6 pt-8 pb-6">
            <h1 class="text-4xl font-display font-semibold tracking-tighter">Andes Capital 360's Selection</h1>
            <p class="mt-2 max-w-3xl text-sm text-zinc-400">
                High-conviction ideas outside the mining space. Junior mining stocks are highly speculative and volatile. Always do your own due diligence.
            </p>
        </div>
    </div>

    <div class="max-w-screen-2xl mx-auto px-6 pt-6 pb-4">
        <button onclick="refreshPrices()" 
                class="px-5 py-2.5 border border-zinc-700 rounded-2xl hover:bg-zinc-900 flex items-center gap-x-2 text-sm">
            <i class="fa-solid fa-sync fa-sm"></i> 
            <span>Refresh Prices</span>
        </button>
    </div>

    <div class="max-w-screen-2xl mx-auto px-6 pb-12">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden">
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-xs text-zinc-400 font-semibold border-b border-zinc-700">
                        <th class="text-left py-3 pl-6">TICKER</th>
                        <th class="text-left py-3">NAME</th>
                        <th class="text-right py-3 pr-6">PRICE</th>
                        <th class="text-right py-3 pr-6">MARKET CAP</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-zinc-800"></tbody>
            </table>
        </div>
    </div>

    <script>
        const stocks = [
            { ticker: 'BMNR', name: 'Bitmine Immersion Technologies' },
            { ticker: 'IREN', name: 'Iris Energy' },
            { ticker: 'NVDA', name: 'NVIDIA Corporation' },
            { ticker: 'RIOT', name: 'Riot Platforms' },
            { ticker: 'TSLA', name: 'Tesla, Inc.' }
        ];

        let data = [...stocks];

        function formatMarketCap(value) {
            if (!value) return '—';
            if (value >= 1e12) return '$' + (value / 1e12).toFixed(2) + 'T';
            if (value >= 1e9) return '$' + (value / 1e9).toFixed(1) + 'B';
            return '$' + (value / 1e6).toFixed(0) + 'M';
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            data.forEach(item => {
                const row = document.createElement('tr');
                row.className = 'hover:bg-zinc-800/50';
                row.innerHTML = `
                    <td class="pl-6 py-3 font-mono text-amber-400 font-semibold">${item.ticker}</td>
                    <td class="py-3">${item.name}</td>
                    <td class="text-right pr-6 tabular-nums font-medium">$${item.price ? item.price.toFixed(2) : '—'}</td>
                    <td class="text-right pr-6 tabular-nums font-medium">${formatMarketCap(item.market_cap)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        async function refreshPrices() {
            const btnText = document.getElementById('refresh-btn-text');
            const original = btnText.textContent;
            btnText.textContent = 'Refreshing...';

            for (let item of data) {
                try {
                    const res = await fetch(`/.netlify/functions/refresh-prices?ticker=${item.ticker}`);
                    if (res.ok) {
                        const d = await res.json();
                        if (d.price) {
                            item.price = d.price;
                            if (d.market_cap) item.market_cap = d.market_cap;
                        }
                    }
                } catch (e) {}
                await new Promise(r => setTimeout(r, 180));
            }

            renderTable();
            btnText.textContent = 'Done';
            setTimeout(() => btnText.textContent = original, 1800);
        }

        // Initial load with some demo prices (will be overwritten on refresh)
        data.forEach((s, i) => {
            s.price = [245, 3.8, 118, 9.2, 272][i];
            s.market_cap = [780e9, 420e6, 2.9e12, 2.8e9, 870e9][i];
        });

        renderTable();
    </script>
</body>
</html>
