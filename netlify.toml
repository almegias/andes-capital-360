[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# Reduce aggressive caching so Refresh button and updates appear quickly
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA redirect (functions are automatically excluded by Netlify)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200