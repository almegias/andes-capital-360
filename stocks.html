<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Stocks • Andes Capital 360</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
        .font-display { font-family: 'Space Grotesk', 'Inter', sans-serif; font-weight: 600; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">
    <!-- Full Header like Mining page -->
    <nav class="border-b border-zinc-800 bg-zinc-950/95 backdrop-blur-lg sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-x-3">
                <div class="flex items-center gap-x-3">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect width="40" height="40" rx="6" fill="#1e3a5f"/>
                        <polygon points="0,32 6,18 12,26 18,12 24,24 30,10 36,20 40,28 40,40 0,40" fill="#475569"/>
                        <polygon points="0,36 5,24 11,30 17,17 23,28 29,15 35,25 40,32 40,40 0,40" fill="#64748b"/>
                        <polygon points="6,18 9,22 12,18 12,26 9,23 6,26" fill="#f1f5f9"/>
                        <polygon points="18,12 21,17 24,12 24,24 21,20 18,24" fill="#f1f5f9"/>
                        <polygon points="30,10 33,15 36,10 36,20" fill="#e0f2fe"/>
                        <rect x="0" y="33" width="40" height="7" fill="#3f2a1d"/>
                        <g stroke="#166534" stroke-width="1.3">
                            <line x1="1" y1="34.5" x2="39" y2="34.5"/>
                            <line x1="1" y1="36.5" x2="39" y2="36.5"/>
                            <line x1="1" y1="38.5" x2="39" y2="38.5"/>
                        </g>
                        <g stroke="#4ade80" stroke-width="0.7">
                            <circle cx="5" cy="35" r="1.4"/>
                            <circle cx="12" cy="37" r="1.4"/>
                            <circle cx="19" cy="35" r="1.4"/>
                            <circle cx="26" cy="37" r="1.4"/>
                            <circle cx="33" cy="35" r="1.4"/>
                        </g>
                        <circle cx="6.5" cy="35.2" r="0.7" fill="#f59e0b"/>
                        <circle cx="20.5" cy="35.2" r="0.7" fill="#f59e0b"/>
                    </svg>
                    <div>
                        <span class="font-display text-3xl font-semibold tracking-tighter">Andes Capital</span>
                        <span class="font-display text-3xl font-semibold tracking-tighter text-amber-400">360</span>
                    </div>
                    <div class="px-3 py-1 rounded-full bg-zinc-900 border border-zinc-800 text-[10px] font-medium tracking-widest text-amber-400">HIGH RISK, HIGH REWARD</div>
                </div>
            </div>

            <div class="flex items-center gap-x-3 text-sm">
                <button onclick="refreshPrices()" class="px-4 py-2 border border-zinc-700 rounded-2xl hover:bg-zinc-900 flex items-center gap-x-2">
                    <i class="fa-solid fa-sync fa-sm"></i> 
                    <span id="refresh-btn-text">Refresh Prices</span>
                </button>

                <button onclick="showAddStockModal()" class="px-5 py-2 bg-gradient-to-r from-amber-400 to-yellow-500 text-zinc-950 font-semibold rounded-2xl">
                    <i class="fa-solid fa-plus"></i> <span>Add Company</span>
                </button>
                <span class="text-[10px] text-amber-400 -ml-2">Premium</span>

                <button onclick="alert('Subscribe is a Premium feature.')" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-2xl">
                    <i class="fa-solid fa-credit-card"></i> <span>Subscribe $14.99/mo</span>
                </button>

                <button onclick="showStockWatchlist()" class="px-4 py-2 border border-zinc-700 rounded-2xl hover:bg-zinc-900 flex items-center gap-x-2 text-sm">
                    <i class="fa-solid fa-star text-amber-400"></i> <span>Watchlist</span>
                </button>

                <a href="index.html" 
                   class="px-4 py-2 border border-zinc-700 rounded-2xl hover:bg-zinc-900 flex items-center gap-x-2 text-sm">
                    ← Back to Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Section Header -->
    <div class="border-b border-zinc-800 bg-zinc-900/40">
        <div class="max-w-screen-2xl mx-auto px-6 pt-8 pb-6">
            <h1 class="text-4xl font-display font-semibold tracking-tighter">Andes Capital 360's Selection</h1>
            <p class="mt-2 max-w-3xl text-sm text-zinc-400">
                Disclaimer: This selection is for informational and educational purposes only and does not constitute investment advice.
            </p>
        </div>
    </div>

    <div class="max-w-screen-2xl mx-auto px-6 pt-6 pb-4 flex items-center gap-x-4">
        <button onclick="refreshPrices()" 
                class="px-5 py-2.5 border border-zinc-700 rounded-2xl hover:bg-zinc-900 flex items-center gap-x-2 text-sm">
            <i class="fa-solid fa-sync fa-sm"></i> 
            <span>Refresh Prices</span>
        </button>

        <input type="text" id="search-stocks" placeholder="Search ticker or name..." 
               onkeyup="filterStocksTable()"
               class="px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-2xl text-sm w-64 focus:outline-none focus:border-amber-400">
    </div>

    <div class="max-w-screen-2xl mx-auto px-6 pb-12">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden">
            <table class="w-full text-sm">
                <thead>
                    <tr class="text-xs text-zinc-400 font-semibold border-b border-zinc-700">
                        <th class="w-8 pl-6"></th>
                        <th class="text-left py-3">TICKER</th>
                        <th class="text-left py-3">NAME</th>
                        <th class="text-right py-3 pr-6">PRICE</th>
                        <th class="text-right py-3 pr-6">MARKET CAP</th>
                        <th class="text-right py-3 pr-6">SCORE</th>
                        <th class="text-center py-3">50-DAY MA</th>
                        <th class="text-left py-3 pl-2">COMMENT</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-zinc-800"></tbody>
            </table>
        </div>
    </div>

    <script>
        const stocks = [
            { ticker: 'BMNR', name: 'Bitmine Immersion Technologies' },
            { ticker: 'IREN', name: 'Iris Energy' },
            { ticker: 'NVDA', name: 'NVIDIA Corporation' },
            { ticker: 'RIOT', name: 'Riot Platforms' },
            { ticker: 'TSLA', name: 'Tesla, Inc.' }
        ];

        let data = [...stocks];
        let stockWatchlist = JSON.parse(localStorage.getItem('stockWatchlist') || '[]');

        function formatMarketCap(value) {
            if (!value) return '—';
            if (value >= 1e12) return '$' + (value / 1e12).toFixed(2) + 'T';
            if (value >= 1e9) return '$' + (value / 1e9).toFixed(1) + 'B';
            return '$' + (value / 1e6).toFixed(0) + 'M';
        }

        function renderTable(filteredData = null) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            const toRender = filteredData || data;

            toRender.forEach((item) => {
                const isWatched = stockWatchlist.includes(item.ticker);
                const dmaText = item.above_50dma === true ? 'Above' : (item.above_50dma === false ? 'Below' : '—');
                const row = document.createElement('tr');
                row.className = 'hover:bg-zinc-800/50';
                row.innerHTML = `
                    <td class="pl-6 py-3">
                        <button onclick="toggleStockWatchlist('${item.ticker}', this)" class="text-lg ${isWatched ? 'text-amber-400' : 'text-slate-600'}">
                            <i class="fa-solid fa-star"></i>
                        </button>
                    </td>
                    <td class="font-mono text-amber-400 font-semibold">${item.ticker}</td>
                    <td class="py-3">${item.name}</td>
                    <td class="text-right pr-6 tabular-nums font-medium">$${item.price ? item.price.toFixed(2) : '—'}</td>
                    <td class="text-right pr-6 tabular-nums font-medium">${formatMarketCap(item.market_cap)}</td>
                    <td class="text-right pr-6 tabular-nums font-medium">${item.score || 60}</td>
                    <td class="text-center py-3">${dmaText}</td>
                    <td class="py-3 text-xs text-zinc-400">${item.comment || ''}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function toggleStockWatchlist(ticker, element) {
            if (stockWatchlist.includes(ticker)) {
                stockWatchlist = stockWatchlist.filter(t => t !== ticker);
                element.classList.remove('text-amber-400');
                element.classList.add('text-slate-600');
            } else {
                stockWatchlist.push(ticker);
                element.classList.remove('text-slate-600');
                element.classList.add('text-amber-400');
            }
            localStorage.setItem('stockWatchlist', JSON.stringify(stockWatchlist));
        }

        function showStockWatchlist() {
            const filtered = data.filter(item => stockWatchlist.includes(item.ticker));
            renderTable(filtered);
        }

        const STORAGE_KEY = 'andes_stocks_prices';

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch (e) {}
        }

        function loadFromLocalStorage() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // Merge saved prices into current data structure
                    parsed.forEach(savedItem => {
                        const match = data.find(d => d.ticker === savedItem.ticker);
                        if (match) {
                            match.price = savedItem.price;
                            match.market_cap = savedItem.market_cap;
                        }
                    });
                    return true;
                }
            } catch (e) {}
            return false;
        }

        async function fetchLivePrices(showLoading = true) {
            const btnText = document.getElementById('refresh-btn-text');
            const original = btnText ? btnText.textContent : '';

            if (showLoading && btnText) {
                btnText.textContent = 'Refreshing...';
            }

            let successCount = 0;

            for (let item of data) {
                try {
                    const res = await fetch(`/.netlify/functions/refresh-prices?ticker=${item.ticker}`);
                    if (res.ok) {
                        const d = await res.json();
                        if (d.price != null) {
                            item.price = d.price;
                            if (d.market_cap != null) item.market_cap = d.market_cap;
                            successCount++;
                        }
                    }
                } catch (e) {}
                await new Promise(r => setTimeout(r, 150));
            }

            renderTable();
            saveToLocalStorage();

            if (showLoading && btnText) {
                btnText.textContent = 'Done';
                setTimeout(() => btnText.textContent = original, 1400);
            }

            return successCount;
        }

        async function refreshPrices() {
            await fetchLivePrices(true);
        }

        async function initializePrices() {
            const hasSavedData = loadFromLocalStorage();

            if (hasSavedData) {
                renderTable();
                fetchLivePrices(false);
            } else {
                await fetchLivePrices(true);
            }
        }

        function filterStocksTable() {
            const searchTerm = document.getElementById('search-stocks').value.toLowerCase();
            const rows = document.querySelectorAll('#table-body tr');

            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        }

        // Start
        initializePrices();

        // ==================== ADD STOCK (Simplified) ====================
        function showAddStockModal() {
            // Create a simple modal dynamically if it doesn't exist
            let modal = document.getElementById('add-stock-modal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'add-stock-modal';
                modal.className = 'fixed inset-0 bg-black/80 z-[110] flex items-center justify-center p-4';
                modal.innerHTML = `
                    <div onclick="event.stopImmediatePropagation()" class="modal bg-zinc-900 border border-zinc-700 rounded-3xl w-full max-w-md p-6">
                        <div class="font-semibold text-xl mb-4">Add New Stock</div>
                        <div>
                            <label class="text-xs text-zinc-400 block mb-1">STOCK NAME OR TICKER</label>
                            <input id="add-stock-input" type="text" placeholder="e.g. NVIDIA or NVDA" 
                                   class="w-full bg-zinc-950 border border-zinc-700 rounded-2xl px-4 py-2.5 mb-4">
                            <p class="text-[10px] text-zinc-500 mb-4">The site will try to fetch live price data.</p>
                        </div>
                        <div class="flex gap-x-3">
                            <button onclick="hideAddStockModal()" class="flex-1 py-3 rounded-2xl border border-zinc-700">Cancel</button>
                            <button onclick="submitAddStock()" class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-amber-400 to-yellow-500 text-zinc-950 font-semibold">Add Stock</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }
            modal.style.display = 'flex';
            setTimeout(() => {
                const input = document.getElementById('add-stock-input');
                if (input) input.focus();
            }, 100);
        }

        function hideAddStockModal() {
            const modal = document.getElementById('add-stock-modal');
            if (modal) modal.style.display = 'none';
        }

        async function submitAddStock() {
            const input = document.getElementById('add-stock-input');
            if (!input) return;

            const raw = input.value.trim();
            if (!raw) {
                alert("Please enter a stock name or ticker.");
                return;
            }

            const ticker = raw.toUpperCase();

            // Avoid duplicates
            if (data.some(d => d.ticker === ticker)) {
                alert("This ticker is already in the list.");
                hideAddStockModal();
                return;
            }

            const newItem = {
                ticker: ticker,
                name: ticker,           // temporary, will be overwritten
                price: null,
                market_cap: null,
                score: 60,
                above_50dma: null,
                comment: "User added"
            };

            // Fetch real name + price data from Yahoo
            try {
                const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`);
                if (res.ok) {
                    const json = await res.json();
                    const result = json?.chart?.result?.[0];
                    if (result) {
                        const meta = result.meta || {};
                        if (meta.shortName) newItem.name = meta.shortName;
                        if (meta.regularMarketPrice) newItem.price = meta.regularMarketPrice;

                        // Also try to get market cap if present
                        const quote = result.indicators?.quote?.[0];
                        if (quote?.marketCap?.[0]) {
                            newItem.market_cap = quote.marketCap[0];
                        }
                    }
                }
            } catch (e) {
                console.warn("Could not fetch Yahoo data for", ticker);
            }

            // Fallback: if we still don't have a proper name, keep the ticker as name
            if (newItem.name === ticker) {
                // Try one more time via the existing function for price data
                try {
                    const res2 = await fetch(`/.netlify/functions/refresh-prices?ticker=${ticker}`);
                    if (res2.ok) {
                        const d = await res2.json();
                        if (d.price != null) newItem.price = d.price;
                        if (d.market_cap != null) newItem.market_cap = d.market_cap;
                    }
                } catch (e) {}
            }

            data.push(newItem);
            saveToLocalStorage();
            renderTable();
            hideAddStockModal();
        }
    </script>
</body>
</html>
